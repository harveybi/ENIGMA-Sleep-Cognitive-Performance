[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enigma-sleep-cognition"
version = "0.1.0"
description = "Analysis code for ENIGMA sleep, brain structure, and cognition models."
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {text = "MIT"}
authors = [
  {name = "ENIGMA Sleep Cognition contributors"}
]
dependencies = [
  "numpy==2.1.3",
  "pandas==2.3.3",
  "scipy==1.15.3",
  "scikit-learn==1.7.2",
  "matplotlib==3.9.0",
  "seaborn==0.13.2",
  "joblib==1.4.2",
  "pyyaml==6.0.1"
]

[tool.setuptools.packages.find]
where = ["src"]
