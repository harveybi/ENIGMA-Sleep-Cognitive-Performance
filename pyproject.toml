[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enigma-sleep-cognition"
version = "0.1.0"
description = "Analysis code for ENIGMA sleep, brain structure, and cognition models."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "ENIGMA Sleep Cognition contributors"}
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "joblib>=1.4",
  "pyyaml>=6.0"
]

[tool.setuptools.packages.find]
where = ["src"]

